plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version '7.0.2'
	id 'net.ltgt.errorprone' version '4.3.0'
	id 'jacoco'
}

// Local builds are dev builds; CI passes the tag (or a commit) through -Pmod_version.
version = providers.gradleProperty('mod_version').orElse('0.0.0-dev').get()

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencyLocking {
	lockAllConfigurations()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"magic-firework" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests for the data layer + interpreter (no game bootstrap involved).
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	errorprone "com.google.errorprone:error_prone_core:2.36.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.errorprone {
		disableWarningsInGeneratedCode = true
		// The codebase uses @return-first Javadocs on purpose; MissingSummary is style, not a bug.
		disable('MissingSummary')
	}
	// Error Prone reports a real class of bugs at ERROR severity; keep javac warnings fatal too.
	it.options.compilerArgs << '-Werror'
}

test {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	dependsOn test
	sourceSets sourceSets.main
	sourceSets sourceSets.client
	reports {
		xml.required = true
		html.required = true
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

spotless {
	// Ratchet from the end of B2: legacy files keep their history, any file touched after
	// this baseline (and every new file) must pass the formatter.
	ratchetFrom '9493d51'
	java {
		target 'src/**/*.java'
		eclipse().configFile('config/eclipse-formatter.xml')
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.gradle', '*.md', 'docs/**/*.md', '.github/**/*.yml', 'gradle.properties'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	classDirectories.setFrom(files(sourceSets.main.output, sourceSets.client.output))
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				// Baseline at the end of B2 was 46.3%; the floor leaves room for a refactor.
				minimum = 0.45
			}
		}
	}
}

check.dependsOn jacocoTestReport, jacocoTestCoverageVerification

tasks.register('resolveAndLockAll') {
	notCompatibleWithConfigurationCache('Resolves every configuration at execution time')
	doFirst {
		assert gradle.startParameter.writeDependencyLocks : 'Run with --write-locks'
	}
	doLast {
		configurations.findAll { it.canBeResolved }.each { it.resolve() }
	}
}
