# Automatically build the project and run any configured tests for every push
# to main and every submitted pull request. This can help catch issues that only
# occur on certain platforms or Java versions, and provides a first line of
# defence against bad commits.

name: build
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Must match gradle/gradle-daemon-jvm.properties: Loom 1.19
          # needs JVM 25+ to run the build. Bytecode is still compiled to
          # Java 17.
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: validate content schemas
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            --break-system-packages jsonschema
          python3 tools/validate_content.py
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
